name: Review upstream log compatibility
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional exact upstream rust-v tag'
        type: string
        required: false
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Select upstream tags
        id: tags
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          git ls-remote --tags --refs https://github.com/openai/codex.git > "$RUNNER_TEMP/upstream-tags"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.check_upstream_log import latest_tag, version_key
          baseline = json.loads(Path('docs/log-version-evidence.json').read_text())[-1]['tag']
          tags = [line.split('\t', 1)[1].removeprefix('refs/tags/') for line in Path(os.environ['RUNNER_TEMP'], 'upstream-tags').read_text().splitlines()]
          requested = os.environ.get('REQUESTED_TAG', '').strip()
          target = requested or latest_tag(tags, baseline)
          if target:
              version_key(target)
              if target not in tags or version_key(target) <= version_key(baseline):
                  raise SystemExit('Requested tag is missing or is not newer than the baseline')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('baseline=' + baseline, file=out)
              print('target=' + (target or ''), file=out)
          PY
      - name: Fetch official source and compare
        if: steps.tags.outputs.target != ''
        env:
          BASELINE_TAG: ${{ steps.tags.outputs.baseline }}
          TARGET_TAG: ${{ steps.tags.outputs.target }}
        run: |
          git init "$RUNNER_TEMP/codex-upstream"
          git -C "$RUNNER_TEMP/codex-upstream" remote add origin https://github.com/openai/codex.git
          git -C "$RUNNER_TEMP/codex-upstream" fetch --no-tags --depth=1 origin "refs/tags/$BASELINE_TAG:refs/tags/$BASELINE_TAG" "refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG"
          python -m scripts.check_upstream_log --source "$RUNNER_TEMP/codex-upstream" --tag "$TARGET_TAG" --apply
          python -m unittest tests.test_upstream_log -q
      - name: Open review pull request
        if: steps.tags.outputs.target != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ steps.tags.outputs.target }}
        run: |
          set -euo pipefail
          version="${TARGET_TAG#rust-v}"
          branch="codex/log-adapter-$version"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo 'Review branch already exists; leaving it unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add collector/indexer.py docs/log-version-evidence.json
          git commit -m "Prepare log adapter for $version"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/log-adapter-pr.md" <<'BODY'
          The reviewed usage structures and recording functions match the last verified upstream tag. This prepares support and increments the parser version so existing caches are rebuilt.

          Before merging, review changes around call sites, serialization, model context, subagent ownership, and pricing semantics. Matching selected blocks alone does not prove end-to-end compatibility. The collector remains conservative until this PR is reviewed, merged, released, and installed.

          Validation: the comparison script verifies the baseline commit and block hashes, compares the target, and runs its regression tests. The workflow explicitly dispatches the full Windows CI on this branch.
          BODY
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Review Codex $version log compatibility" --body-file "$RUNNER_TEMP/log-adapter-pr.md"
          gh workflow run ci.yml --ref "$branch"
