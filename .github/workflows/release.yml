name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bridge_run_id:
        description: 'Optional successful Windows release run with the identical bridge patch'
        type: string
        default: ''
      publish:
        description: 'Publish after all checks and remote asset hashes pass'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from collector import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__"
      - name: Record version
        id: version
        run: |
          $taskVersion = python -c "from collector import __version__; print(__version__)"
          "version=$taskVersion" >> $env:GITHUB_OUTPUT
      - name: Install pinned Rust toolchain
        if: inputs.bridge_run_id == ''
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.99.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust activation failed' }
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: npm ci --ignore-scripts
      - run: npm run test:ui
      - name: Prepare pinned bridge source
        run: .\scripts\Prepare-BridgeSource.ps1
      - name: Test and build bridge host
        if: inputs.bridge_run_id == ''
        run: .\scripts\Build-BridgeHost.ps1
      - name: Verify trusted bridge cache run
        if: inputs.bridge_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRIDGE_RUN_ID: ${{ inputs.bridge_run_id }}
        run: |
          if ($env:BRIDGE_RUN_ID -notmatch '^\d+$') { throw 'Invalid run ID' }
          $taskRun = gh api "repos/$env:GH_REPO/actions/runs/$env:BRIDGE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $taskRun.conclusion -ne 'success' -or $taskRun.head_repository.full_name -ne $env:GH_REPO -or $taskRun.path -ne '.github/workflows/release.yml') { throw 'A successful release run from this repository is required' }
      - uses: actions/download-artifact@v8
        if: inputs.bridge_run_id != ''
        with:
          name: windows-release
          path: .runtime/bridge-cache
          run-id: ${{ inputs.bridge_run_id }}
          github-token: ${{ github.token }}
      - name: Import identical tested bridge
        if: inputs.bridge_run_id != ''
        run: |
          $taskPackage = Get-ChildItem .runtime/bridge-cache -Filter '*-windows-x64.zip' | Where-Object Name -NotLike '*collector-only*' | Select-Object -ExpandProperty FullName
          if (@($taskPackage).Count -ne 1) { throw 'Exactly one complete cached package is required' }
          python -m scripts.package_release --import-bridge-package $taskPackage
          if ($LASTEXITCODE -ne 0) { throw 'Bridge source or checksum mismatch' }
      - name: Build and smoke test standalone collector; package full release
        run: .\scripts\Build.ps1 -WithBridge
      - name: Test installation from actual ZIP
        run: python -m scripts.installation_smoke
      - name: Export public project source and checksums
        run: python -m scripts.export_source
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/codex-usage-display-*-windows-x64.zip
            dist/codex-usage-display-*-source.zip
            dist/SHA256SUMS.txt
  draft:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release-assets
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --paginate | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' | head -1)
          if [ -z "$release_id" ]; then
            gh release create "$RELEASE_TAG" --draft --target "$SOURCE_COMMIT" --title "$RELEASE_TAG" --notes-file CHANGELOG.md
            release_id=$(gh api "repos/$GH_REPO/releases" --paginate | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' | head -1)
          fi
          test -n "$release_id"
          if [ "$(gh api "repos/$GH_REPO/releases/$release_id" --jq .draft)" != true ]; then
            echo 'Release already public; existing assets preserved.'
            exit 0
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f target_commitish="$SOURCE_COMMIT" > /dev/null
          for file in release-assets/*; do
            name=$(basename "$file")
            old_id=$(gh api "repos/$GH_REPO/releases/$release_id/assets" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id')
            if [ -n "$old_id" ]; then gh api --method DELETE "repos/$GH_REPO/releases/assets/$old_id"; fi
            gh api --method POST "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$name" -H 'Content-Type: application/octet-stream' --input "$file" > uploaded.json
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            test "$(jq -r .digest uploaded.json)" = "$expected"
          done
          if [ "$PUBLISH" = true ]; then
            gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true --jq .html_url
          fi
