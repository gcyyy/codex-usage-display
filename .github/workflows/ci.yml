name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: npm ci --ignore-scripts
      - run: npm run test:ui
      - name: Parse Windows installation helpers
        shell: powershell
        run: |
          foreach ($taskFile in @('scripts/Install-CodexPlus.ps1','scripts/Test-CleanMachine.ps1')) {
            $taskTokens = $null
            $taskErrors = $null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $taskFile), [ref]$taskTokens, [ref]$taskErrors) | Out-Null
            if ($taskErrors.Count) { throw ($taskErrors | Out-String) }
          }
      - name: Scan tracked public files
        run: python -c "from scripts.export_source import public_files; print(len(public_files()))"
